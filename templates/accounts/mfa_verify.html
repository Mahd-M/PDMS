{% extends "base.html" %}
{% block title %}Verify code{% endblock %}
{% block content %}
<div class="auth-page">
  <h1>Enter authenticator code</h1>
  <p class="text-muted">Open your authenticator app and enter the current 6-digit code.</p>
  <form method="post" class="stacked">
    {% csrf_token %}
    <label for="id_code">Code</label>
    {{ form.code }}
    <p style="margin-top:1.25rem"><button type="submit" class="btn">Verify</button></p>
  </form>
</div>
{% endblock %}
