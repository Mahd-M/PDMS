{% extends "base.html" %}
{% block title %}Update case status{% endblock %}
{% block content %}
<h1>Update case status &mdash; {{ case.fir.fir_number }}</h1>
<form method="post" class="stacked card">
  {% csrf_token %}
  {% for field in form %}
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
  {% endfor %}
  <p class="form-actions"><button type="submit" class="btn">Save</button></p>
</form>
{% endblock %}
