{% extends "base.html" %}
{% block title %}File new FIR{% endblock %}
{% block content %}
<h1>File new FIR</h1>
<form method="post" class="stacked card">
  {% csrf_token %}
  {% for field in form %}
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% for error in field.errors %}<p style="color:var(--danger)">{{ error }}</p>{% endfor %}
  {% endfor %}
  <p style="margin-top:1.25rem"><button type="submit" class="btn">Save FIR</button></p>
</form>
{% endblock %}
