{% extends "base.html" %}
{% block title %}Add evidence{% endblock %}
{% block content %}
<h1>Add evidence &mdash; {{ case.fir.fir_number }}</h1>
<form method="post" enctype="multipart/form-data" class="stacked card">
  {% csrf_token %}
  {% for field in form %}
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
  {% endfor %}
  <p class="form-actions"><button type="submit" class="btn">Upload</button></p>
</form>
{% endblock %}
